<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 DELUXE | OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        
        * { font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        .glow-text {
            text-shadow: 0 0 10px #00fff5, 0 0 20px #00fff5, 0 0 40px #00fff5;
        }
        .card-glow {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s ease;
        }
        .card-glow:hover, .card-glow.clicked {
            transform: translateY(-3px);
            border-color: #00fff5;
            box-shadow: 0 0 20px rgba(0,255,245,0.25);
        }
        .btn-wa {
            background: linear-gradient(90deg, #25D366, #128C7E);
            transition: all 0.3s ease;
        }
        .btn-tiktok {
            background: linear-gradient(90deg, #000000, #2c2c2c);
            border: 1px solid #FE2C55;
        }
        .float-animation { animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%,100%{transform:translateY(0)}
            50%{transform:translateY(-8px)}
        }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%{opacity:1}50%{opacity:0.4}100%{opacity:1}
        }
        .btn-lanjut {
            background: linear-gradient(90deg, #f59e0b, #eab308);
            transition: all 0.3s ease;
        }
        .btn-lanjut:disabled {
            background: #374151;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-lanjut:enabled:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #f59e0b;
        }
        .checkmark {
            color: #22c55e;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .card-glow.clicked .checkmark { opacity: 1; }
    </style>
</head>
<body class="flex flex-col items-center justify-center px-4 py-10">

    <div class="text-center mb-8 float-animation">
        <h1 class="text-3xl font-extrabold text-white mb-2">👑 DELUXE | OFFICIAL 👑</h1>
        <p class="text-cyan-300">Buka Semua Saluran di Bawah Ini Dulu</p>
        <div class="flex items-center justify-center gap-2 mt-2">
            <span class="inline-block w-3 h-3 bg-green-400 rounded-full pulse-dot"></span>
            <span class="text-green-300 text-sm">Sedang Aktif</span>
        </div>
    </div>

    <div class="w-full max-w-md space-y-4" id="linkContainer">

        <!-- Saluran 1 -->
        <a href="https://whatsapp.com/channel/0029Vb7Atub96H4Whbd17o3E" target="_blank" class="card-glow rounded-2xl p-5 block" data-id="1">
            <div class="flex items-center gap-4">
                <div class="btn-wa rounded-full w-12 h-12 flex items-center justify-center text-white text-xl">
                    <i class="fa fa-whatsapp"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-white font-bold">Saluran Utama 1</h3>
                    <p class="text-gray-300 text-sm">Info Update di Sini ✅</p>
                </div>
                <i class="fa fa-check-circle checkmark text-xl"></i>
            </div>
        </a>

        <!-- Saluran 2 -->
        <a href="https://whatsapp.com/channel/0029VbCtCkuAojYxWy8Ufw3n" target="_blank" class="card-glow rounded-2xl p-5 block" data-id="2">
            <div class="flex items-center gap-4">
                <div class="btn-wa rounded-full w-12 h-12 flex items-center justify-center text-white text-xl">
                    <i class="fa fa-whatsapp"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-white font-bold">Saluran Utama 2</h3>
                    <p class="text-gray-300 text-sm">Info Update di Sini ✅</p>
                </div>
                <i class="fa fa-check-circle checkmark text-xl"></i>
            </div>
        </a>

        <!-- Saluran 3 -->
        <a href="https://whatsapp.com/channel/0029Vb94K7L6BIEkEeqaEK34" target="_blank" class="card-glow rounded-2xl p-5 block" data-id="3">
            <div class="flex items-center gap-4">
                <div class="btn-wa rounded-full w-12 h-12 flex items-center justify-center text-white text-xl">
                    <i class="fa fa-whatsapp"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-white font-bold">Saluran File</h3>
                    <p class="text-gray-300 text-sm">Info Update di Sini ✅</p>
                </div>
                <i class="fa fa-check-circle checkmark text-xl"></i>
            </div>
        </a>

        <!-- TikTok -->
        <a href="https://tiktok.com/@tex..45..cheat" target="_blank" class="card-glow rounded-2xl p-5 block" data-id="4">
            <div class="flex items-center gap-4">
                <div class="btn-tiktok rounded-full w-12 h-12 flex items-center justify-center text-white text-xl">
                    <i class="fa fa-play"></i>
                </div>

                    <h3 class="text-white font-bold">TikTok Official</h3>

                </div>
                <i class="fa fa-check-circle checkmark text-xl"></i>
            </div>
        </a>
    </div>

    <p class="text-gray-400 text-sm mt-4 text-center">
        Sudah diklik: <span id="count">0</span> / 4
    </p>

    <!-- TOMBOL LANJUT -->
    <div class="mt-8 w-full max-w-md">
        <button id="btnLanjut" disabled class="btn-lanjut w-full py-4 rounded-2xl font-bold text-gray-900 text-lg">
            🔒 Buka Semua Saluran Dulu
        </button>
    </div>

    <div class="mt-10 text-center">
        <p class="text-gray-400 text-xs">© 2026 DELUXE OFFICIAL</p>
    </div>

<script>
// ================= UBAH LINK DI SINI =================
const LINK_TUJUAN = "https://link-kamu-disini.com/cit-gratisan";
// =======================================================

let clickedLinks = new Set();
const totalLinks = 4;

document.querySelectorAll('.card-glow').forEach(link => {
    link.addEventListener('click', function() {
        const id = this.getAttribute('data-id');
        if (!this.classList.contains('clicked')) {
            this.classList.add('clicked');
            clickedLinks.add(id);
            updateUI();
        }
    });
});

function updateUI() {
    document.getElementById('count').textContent = clickedLinks.size;
    const btn = document.getElementById('btnLanjut');
    
    if (clickedLinks.size === totalLinks) {
        btn.disabled = false;
        btn.innerHTML = "✅ BUKA CIT GRATISAN ✅";
        btn.onclick = function() {
            // Buka di tab baru / browser baru
            window.open(LINK_TUJUAN, '_blank');
        };
    }
}
</script>
</body>
</html>
